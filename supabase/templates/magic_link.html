<!doctype html>
<html lang="pt-BR">
  <body
    style="
      margin: 0;
      padding: 32px 16px;
      background: #f6f7f9;
      font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, sans-serif;
      color: #111827;
    "
  >
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 420px; background: #ffffff; border-radius: 12px; padding: 32px"
          >
            <tr>
              <td>
                <p style="margin: 0 0 4px; font-size: 13px; color: #6b7280">
                  Finance Dashboard · OTM Group
                </p>
                <h1 style="margin: 0 0 16px; font-size: 20px">Seu código de acesso</h1>
                <p style="margin: 0 0 24px; font-size: 14px; line-height: 1.5; color: #374151">
                  Digite o código abaixo na tela de login. Ele vale por 1 hora e só pode ser usado
                  uma vez.
                </p>
                <p
                  style="
                    margin: 0 0 24px;
                    padding: 16px;
                    background: #f3f4f6;
                    border-radius: 8px;
                    text-align: center;
                    font-family: &quot;SFMono-Regular&quot;, Menlo, Consolas, monospace;
                    font-size: 28px;
                    font-weight: 600;
                    letter-spacing: 8px;
                  "
                >
                  {{ .Token }}
                </p>
                <p style="margin: 0; font-size: 12px; line-height: 1.5; color: #6b7280">
                  Se você não tentou entrar, ignore este e-mail — ninguém acessa sua conta sem este
                  código.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
